name: Update broadband data

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the release is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for a new release and rebuild
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m broadband.update --force
          else
            python -m broadband.update
          fi

      - name: Look up coordinates for any new UPRNs (no-op if none)
        run: python -m broadband.coords

      - name: Refresh site data
        run: python -c "from broadband.site import build_site; print(build_site(), 'points')"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data docs)" ]; then
            echo "No changes; not committing."
            exit 0
          fi
          release=$(python -c "import json; print(json.load(open('data/release.json'))['title'])")
          if git status --porcelain data docs | grep -qv 'last_check.json'; then
            msg="Update data: ${release}"
          else
            msg="Weekly check: no new release"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "${msg}"
          git push
